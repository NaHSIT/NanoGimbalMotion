; nanogreat 独立工程配置。
[platformio]
default_envs = nanogreat

[env]
platform = atmelavr
board = nanoatmega328new
framework = arduino
lib_deps =
    waspinator/AccelStepper @ ^1.64

; nanogreat 正式固件。
[env:nanogreat]
build_flags = -DGIMBAL_PROFILE=4

; 仅编译 BootMotion 轨迹测试，不包含实际电机控制入口。
[env:nanogreat_test]
build_flags = -DBOOT_MOTION_SELF_TEST=1
build_src_filter =
    -<main.cpp>
    -<nanogreatMount.cpp>
    +<bootMotionSelfTest.cpp>

