; gimbal_3 独立启动动画工程，不参与上级 Nano 主工程编译。
[platformio]
default_envs = gimbal_3_boot

[env]
platform = atmelavr
board = nanoatmega328new
framework = arduino
lib_deps =
    file://../lib/AccelStepper

[env:gimbal_3_boot]
build_flags =
    -DBOOT_UNIT_ID=3
    -DBOOT_TILT_MIN_DEGREES=-30.0f
    -DBOOT_TILT_MAX_DEGREES=45.0f

[env:gimbal_3_boot_test]
build_flags =
    -DBOOT_MOTION_SELF_TEST=1
    -DBOOT_UNIT_ID=3
    -DBOOT_TILT_MIN_DEGREES=-30.0f
    -DBOOT_TILT_MAX_DEGREES=45.0f
build_src_filter =
    -<main.cpp>
    -<nanogreatMount.cpp>
    +<bootMotionSelfTest.cpp>
